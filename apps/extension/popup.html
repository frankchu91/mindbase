<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 320px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; font-size: 14px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      .title { font-weight: 600; margin-bottom: 4px; word-break: break-word; }
      .url { font-size: 12px; color: #666; margin-bottom: 12px; word-break: break-all; }
      button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #171717; color: white; cursor: pointer; font-size: 14px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { margin-top: 8px; font-size: 12px; padding: 6px; border-radius: 4px; }
      .success { background: #dcfce7; color: #166534; }
      .error { background: #fee2e2; color: #991b1b; }
      .busy { background: #f3f4f6; color: #374151; }
    </style>
  </head>
  <body>
    <h1>MindBase Web Clipper</h1>
    <div id="root">Loading...</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
